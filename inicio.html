<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1a0e">
<title>Sistemas Inova Genética</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#fff;background:#2b1a0e;
    background:linear-gradient(170deg,#2b1a0e 0%,#3b2212 55%,#b8470f 130%);
    min-height:100vh;display:flex;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:460px;display:flex;flex-direction:column;gap:22px;justify-content:center}
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .brand img{width:150px;max-width:60%;height:auto;border-radius:10px}
  h1{margin:0;font-size:22px;line-height:1.2;font-weight:800;text-wrap:balance}
  .sub{margin:0;color:#e6d3bf;font-size:14px}
  .cards{display:flex;flex-direction:column;gap:14px}
  a.card{
    display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#2b1a0e;background:#fff;
    border-radius:16px;padding:18px 20px;min-width:0;box-shadow:0 8px 24px rgba(0,0,0,.28);
    transition:transform .12s;
  }
  a.card:active{transform:scale(.98)}
  a.card:focus-visible{outline:3px solid #ffd43b;outline-offset:3px}
  a.card .tt{font-size:19px;font-weight:800;color:#c2410c}
  a.card .dd{font-size:14px;line-height:1.4;color:#5b4636}
  a.card .go{margin-top:6px;font-size:13px;font-weight:700;color:#ea580c}
  .foot{margin:0;text-align:center;font-size:12px;color:#c9b29a}
</style>
